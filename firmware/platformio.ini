; TVC firmware build configuration. See SPEC.md Sections 1, 4, and 9.
;
; [env:native] compiles core/ (via lib_extra_dirs, since core/ lives at the repo root, shared
; with sim/) against firmware/test/, so `pio test -e native` exercises the real controller
; code with no hardware involved.
;
; [env:teensy_flight] is the vehicle firmware (src/flight/): STAND_OPEN sequencer, open-loop
; profiles, SD + LittleFS logging, USB serial console, and now the radio/telemetry link (SPEC.md
; Section 4.7/4.8, Section 9 Phase 4): radio.cpp/telemetry.cpp send TELEM/STATUS/EVENT over the
; RFM95W. SIM_ONBOARD/HIL/STAND_CLOSED/FLIGHT are still not implemented (see
; src/flight/sequencer.h's top comment); dispatching uplink commands other than HEARTBEAT from
; radio is deferred to the ground-GUI phase (see SPEC.md Section 4.7).
;
; [env:teensy_test_servo] is servo_ident (src/tools/servo_ident.cpp), SPEC.md Section 9 Phase
; 3's other deliverable: derives params::servo::{us_per_deg,neutral_us} by jogging a servo and
; reading the encoder back. It pulls in src/flight/encoders.cpp and servo_drive.cpp directly
; (see build_src_filter) rather than duplicating them.
;
; [env:feather_bridge] is the ground radio <-> USB bridge (src/feather_bridge/, SPEC.md Section
; 4.8): stateless relay, Adafruit Feather M0 RFM95 (#3178). Uploading to a Feather M0 needs its
; double-tap bootloader sequence, not a plain `pio run -t upload`: press the reset button twice
; quickly (the onboard LED starts a slow fade/pulse when the bootloader is active and the board
; re-enumerates as a different USB device for a few seconds), then run the upload while it's in
; that state. teensy_test_radio (a vehicle-side bare radio smoke test) is not added this phase --
; radio.cpp inside teensy_flight already exercises the same RH_RF95 path end to end.

[env:native]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@^2.6.1
lib_extra_dirs = ..
; lib_extra_dirs=.. scans the repo root for library folders; since this project's own root
; (firmware/) is one level under that, PlatformIO also finds "firmware" itself as a candidate
; (self-referential) and, now that src/flight/ has real sources, tries to compile them for
; native too. lib_ignore excludes that; core/ (the one we actually want from the repo root)
; is unaffected.
lib_ignore = firmware
build_flags =
    -std=c++17
    -O0
    -ffp-contract=off
extra_scripts = pre:pio_pregen_params.py

[env:teensy_flight]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = -<*> +<flight/>
lib_extra_dirs = ..
; RadioHead@1.120.0 ignored per SPEC.md Section 10: Teensyduino's bundled copy under that exact
; name collides with the PaulStoffregen fork pulled in below (the mikem/ namespace one).
lib_ignore =
    firmware
    RadioHead@1.120.0
lib_deps =
    greiman/SdFat@^2.2.2
    https://github.com/PaulStoffregen/RadioHead.git
build_flags =
    -Wl,-u,_printf_float
extra_scripts = pre:pio_pregen_params.py

[env:feather_bridge]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
build_src_filter = -<*> +<feather_bridge/>
lib_extra_dirs = ..
lib_ignore = firmware  ; see the comment in [env:native]
lib_deps = https://github.com/PaulStoffregen/RadioHead.git
extra_scripts = pre:pio_pregen_params.py

[env:teensy_test_servo]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = -<*> +<tools/servo_ident.cpp> +<flight/encoders.cpp> +<flight/servo_drive.cpp>
lib_extra_dirs = ..
lib_ignore = firmware  ; see the comment in [env:native]
build_flags =
    -Wl,-u,_printf_float
    -Isrc/flight  ; servo_ident.cpp (src/tools/) #includes encoders.h/servo_drive.h by quoted
                  ; name; quoted includes search the including file's own dir first, which is
                  ; src/tools/, not src/flight/ where those headers actually live.
extra_scripts = pre:pio_pregen_params.py

[env:teensy_spi_test]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = +<spi_version_test.cpp> -<static_fire.cpp> -<radio_test_tx.cpp>
