; TVC firmware build configuration. See SPEC.md Sections 1, 4, and 9.
;
; [env:native] compiles core/ (via lib_extra_dirs, since core/ lives at the repo root, shared
; with sim/) against firmware/test/, so `pio test -e native` exercises the real controller
; code with no hardware involved.
;
; [env:teensy_flight] is the vehicle firmware (src/flight/), STAND_OPEN mode only so far, per
; the compressed-phases session that added it: sequencer, open-loop profiles, SD + LittleFS
; logging, USB serial console. SIM_ONBOARD/HIL/STAND_CLOSED/FLIGHT and radio are not yet
; implemented (see src/flight/sequencer.h's top comment).
;
; [env:teensy_test_servo] is servo_ident (src/tools/servo_ident.cpp), SPEC.md Section 9 Phase
; 3's other deliverable: derives params::servo::{us_per_deg,neutral_us} by jogging a servo and
; reading the encoder back. It pulls in src/flight/encoders.cpp and servo_drive.cpp directly
; (see build_src_filter) rather than duplicating them. Remaining hardware envs
; (teensy_test_radio, feather_bridge) still land in their own later phases.

[env:native]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@^2.6.1
lib_extra_dirs = ..
; lib_extra_dirs=.. scans the repo root for library folders; since this project's own root
; (firmware/) is one level under that, PlatformIO also finds "firmware" itself as a candidate
; (self-referential) and, now that src/flight/ has real sources, tries to compile them for
; native too. lib_ignore excludes that; core/ (the one we actually want from the repo root)
; is unaffected.
lib_ignore = firmware
build_flags =
    -std=c++17
    -O0
    -ffp-contract=off
extra_scripts = pre:pio_pregen_params.py

[env:teensy_flight]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = -<*> +<flight/>
lib_extra_dirs = ..
lib_ignore = firmware  ; see the comment in [env:native]
lib_deps = greiman/SdFat@^2.2.2
build_flags =
    -Wl,-u,_printf_float
extra_scripts = pre:pio_pregen_params.py

[env:teensy_test_servo]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = -<*> +<tools/servo_ident.cpp> +<flight/encoders.cpp> +<flight/servo_drive.cpp>
lib_extra_dirs = ..
lib_ignore = firmware  ; see the comment in [env:native]
build_flags =
    -Wl,-u,_printf_float
    -Isrc/flight  ; servo_ident.cpp (src/tools/) #includes encoders.h/servo_drive.h by quoted
                  ; name; quoted includes search the including file's own dir first, which is
                  ; src/tools/, not src/flight/ where those headers actually live.
extra_scripts = pre:pio_pregen_params.py

[env:teensy_spi_test]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = +<spi_version_test.cpp> -<static_fire.cpp> -<radio_test_tx.cpp>
