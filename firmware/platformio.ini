; TVC firmware build configuration. See SPEC.md Sections 1, 4, and 9.
;
; Phase 1 scope is [env:native] only: it compiles core/ (via lib_extra_dirs, since core/
; lives at the repo root, shared with sim/) against firmware/test/, so `pio test -e native`
; exercises the real controller code with no hardware involved.
;
; Hardware envs (teensy_flight, teensy_test_servo, teensy_test_radio, feather_bridge) are
; added in their own later phases per SPEC.md Section 9. Do not add them here yet.

[env:native]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@^2.6.1
lib_extra_dirs = ..
build_flags =
    -std=c++17
    -O0
    -ffp-contract=off
extra_scripts = pre:pio_pregen.py
